version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades are manual: they are breaking, and several here must stay on the
      # version the Expo SDK / expo-router expects (e.g. query-string 7 is the last CommonJS release).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Expo pins matching versions of these per SDK. Move them together with an SDK
      # upgrade (`npx expo install --fix`); patch updates are still allowed.
      - dependency-name: "expo"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@react-native-*"
        update-types: ["version-update:semver-minor"]
      # Payments SDK: Expo SDK 53 pins 0.45.x; later versions need newer React Native, Kotlin and
      # Android/iOS toolchains. Upgrade it with the Expo SDK (`npx expo install @stripe/stripe-react-native`).
      - dependency-name: "@stripe/stripe-react-native"
      - dependency-name: "react-native"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
